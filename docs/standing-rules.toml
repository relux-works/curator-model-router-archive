# Example story exception; sol resolves to gpt-6.1-sol per catalog/NOTES.md.
# Story IDs are caller-provided; <PROJECT-ID> is the project context for this example.
[[rules]]
id = "story-sol-high"
source = "per-story operator exception: <PROJECT-ID>/<STORY-ID>"
rationale = "Pin <PROJECT-ID> story <STORY-ID> to Sol high as explicitly ruled."
[rules.when]
story = "<STORY-ID>"
[rules.require]
runtime = "codex"
model = "gpt-6.1-sol"
[rules.effort]
pin = "high"
