# Operator rulings in force on 2026-10-05. Decode into recommend.DefaultPolicy().
# Exact canonical names only; the CLI resolves aliases and supplies the hostname.
# Keep rule order: hard filters accumulate and forbid always beats require.
# These are operator constraints, not evidence of candidate admission.
schema_version = "recommend-policy-v1"

[tier_edges]
s = 62
a = 56
b = 45

# Review measurements use their own scale; index fallbacks retain tier_edges.
[review_tier_edges]
s = 40
a = 30
b = 20

[[rules]]
id = "mini-codex-first"
source = "tb-R164"
rationale = "Prefer Codex inside each qualified tier; demanding reviews prefer Codex only within the best-quality band."
[rules.when]
host = "<your-mini-host>"
difficulty = ["trivial", "routine", "standard", "hard", "critical"]
[rules.prefer]
runtimes = ["codex", "claude", "agy", "muse", "local-qwen"]

[[rules]]
id = "mini-review-astra-medium"
source = "tb-R164"
rationale = "Pin normal trivial/routine/standard mini reviews to Astra medium; stronger reviews retain the tier floor and Codex preference."
[rules.when]
host = "<your-mini-host>"
role = "reviewer"
difficulty = ["trivial", "routine", "standard"]
sensitivity = ["normal"]
[rules.require]
runtime = "codex"
model = "gpt-6-astra"
[rules.effort]
pin = "medium"

[[rules]]
id = "codex-quota-stop"
source = "tb-R139"
rationale = "Stop Codex when any applicable known window, including weekly, has at most 25% headroom."
quota_stop_bp = 2500
[rules.when]
runtime = "codex"

[[rules]]
id = "cross-provider-review"
source = "tb-R121; mini exception tb-R164"
rationale = "Review across producer families, with same-provider last resort and the explicit mini exception."
[rules.when]
role = "reviewer"
[rules.cross_provider_review]
allow_same_provider_fallback = true
except_hosts = ["<your-mini-host>"]

[[rules]]
id = "refusal-rotation"
source = "tb-R119"
rationale = "Honor caller --exclude runtime/model pairs after a model refuses."
exclude = true
[rules.when]

